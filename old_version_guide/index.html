<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MH Monster Guide</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div id="loadingScreen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #111; z-index: 999999; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #e3c16f; font-family: 'Segoe UI', sans-serif;">
      <div style="font-size: 4rem; animation: spin 2s linear infinite;">⏳</div>
      <h2 style="margin-top: 20px;">Loading Monsters...</h2>
      <style>@keyframes spin { 100% { transform: rotate(360deg); } }</style>
    </div>

    <div class="audio-container">
      <div id="youtube-player"></div>
      <button onclick="toggleMute()" id="muteBtn" class="game-button">
        🔊 Mute Music
      </button>
    </div>

    <img src="Logo.png" alt="MHW Logo" class="top-left-logo" />

    <button
      id="btn-login"
      class="admin-top-right-btn"
      onclick="openLoginModal()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
        <polyline points="10 17 15 12 10 7"></polyline>
        <line x1="15" y1="12" x2="3" y2="12"></line>
      </svg>
      Admin
    </button>

    <button
      id="btn-logout"
      class="admin-top-right-btn logout-variant"
      onclick="logoutAdmin()"
      style="display: none"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
      Logout
    </button>

    <div class="main-container" id="mainContainer">
      <div class="section sec1 active">
        <div class="hero-content">
          <h1 class="hero-title">WELCOME HUNTER</h1>
          <p class="hero-subtitle">
            รวบรวมเนื้อหาข้อมูลมอนสเตอร์
            เพื่อให้มือใหม่และมือฉมังมาเปิดดูวิธีสู้และจุดอ่อน
          </p>
          <div class="hero-buttons">
            <button class="primary-btn" onclick="scrollToSection(1)">
              ดูรายชื่อมอนสเตอร์ (MONSTER LIST)
            </button>
          </div>
        </div>

        <div class="scroll-down" onclick="scrollToSection(1)">
          <span class="scroll-text">เลื่อนลงเพื่อดูเนื้อหา monster</span>
          <div class="arrow"></div>
        </div>
      </div>

      <div class="section sec2" id="sec-world">
        <h1 class="monster-list-title">Monster List (World)</h1>
        <div class="search-container">
          <input
            type="text"
            id="searchInput"
            placeholder="🔍 ค้นหาชื่อมอนสเตอร์ทั้งหมด (เช่น Rathalos)..."
            onkeyup="handleSearch(this.value)"
          />
        </div>
        <div class="monster-grid" id="grid-world"></div>
      </div>

      <div class="section sec3" id="sec-iceborne">
        <h1 class="monster-list-title" style="color: #81d4fa; text-shadow: 0 2px 4px rgba(0,0,0,0.8);">Monster List (Iceborne)</h1>
        <div class="monster-grid" id="grid-iceborne"></div>
      </div>

      <div class="section sec4" id="sec-more">
        <h1 style="color: white; z-index: 2">More to come...</h1>
      </div>
    </div>

    <div class="modal-overlay" id="monsterModal">
      <div class="book-container">
        <div class="close-btn" onclick="closeModal()">&times;</div>
        <div class="book-content-scroll" id="bookContent"></div>
      </div>
    </div>

    <div class="modal-overlay" id="addMonsterModal">
      <div class="book-container add-form-container">
        <div class="close-btn" onclick="closeAddModal()">&times;</div>
        <div class="book-content-scroll">
          <h2 style="text-align: center; color: #5f4b8b">+ เพิ่มมอนสเตอร์ใหม่</h2>
          <form id="addMonsterForm" class="monster-form">
            <div class="input-group">
              <label>หมวดหมู่ภาค (Category):</label>
              <select id="newCategory" required>
                <option value="world">ภาค World (พื้นหลังป่า)</option>
                <option value="iceborne">ภาค Iceborne (พื้นหลังหิมะ)</option>
              </select>
            </div>
            <div class="input-group">
              <label>1. ชื่อมอนสเตอร์ (Monster Name):</label>
              <input type="text" id="newName" placeholder="เช่น Great Jagras" required />
            </div>
            
            <div class="input-group">
              <label>2. ประเภท (Species):</label>
              <input type="text" id="newSpecies" placeholder="เช่น Fanged Wyvern, Elder Dragon" required />
            </div>
            <div class="input-group">
              <label>3. สถานที่พบ (Habitats):</label>
              <textarea id="newHabitats" rows="2" placeholder="เช่น Ancient Forest&#10;Wildspire Waste" required></textarea>
            </div>
            <div class="input-group">
              <label>4. สถานะผิดปกติ (Ailments Inflicted):</label>
              <textarea id="newAilments" rows="2" placeholder="เช่น พ่นไฟ (Fireblight)&#10;ติดพิษ (Poison)" required></textarea>
            </div>

            <div class="input-group">
              <label>5. รูปปก Icon (อัพโหลดรูปภาพ):</label>
              <input type="file" id="newThumbnail" accept="image/*" required />
            </div>
            <div class="input-group">
              <label>6. รูปภาพมอนสเตอร์ (อัพโหลดรูปภาพ):</label>
              <input type="file" id="newDetailImage" accept="image/*" required />
            </div>
            <div class="input-group">
              <label>7. รายละเอียด (General Info):</label>
              <textarea id="newDescription" rows="4" placeholder="ข้อมูลทั่วไปของมอนสเตอร์..." required></textarea>
            </div>
            <div class="input-group">
              <label>8. ข้อมูลจุดอ่อน (Weakness Text):</label>
              <textarea id="newWeaknessText" rows="3" placeholder="เช่น แพ้ไฟ (Fire) ⭐️⭐️⭐️" required></textarea>
            </div>
            <div class="input-group">
              <label>9. รูปภาพบอกจุดอ่อน (อัพโหลดรูปภาพ):</label>
              <input type="file" id="newWeaknessChart" accept="image/*" />
            </div>
            <button type="submit" class="game-button submit-btn">บันทึกข้อมูลมอนสเตอร์</button>
          </form>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="editMonsterModal">
      <div class="book-container add-form-container">
        <div class="close-btn" onclick="closeEditModal()">&times;</div>
        <div class="book-content-scroll">
          <h2 style="text-align: center; color: #1565c0">📝 แก้ไขข้อมูลมอนสเตอร์</h2>
          <form id="editMonsterForm" class="monster-form">
            <input type="hidden" id="editMonsterId" />
            <div class="input-group">
              <label>หมวดหมู่ภาค (Category):</label>
              <select id="editCategory" required>
                <option value="world">ภาค World (พื้นหลังป่า)</option>
                <option value="iceborne">ภาค Iceborne (พื้นหลังหิมะ)</option>
              </select>
            </div>
            <div class="input-group">
              <label>1. ชื่อมอนสเตอร์ (Monster Name):</label>
              <input type="text" id="editName" required />
            </div>

            <div class="input-group">
              <label>2. ประเภท (Species):</label>
              <input type="text" id="editSpecies" required />
            </div>
            <div class="input-group">
              <label>3. สถานที่พบ (Habitats):</label>
              <textarea id="editHabitats" rows="2" required></textarea>
            </div>
            <div class="input-group">
              <label>4. สถานะผิดปกติ (Ailments Inflicted):</label>
              <textarea id="editAilments" rows="2" required></textarea>
            </div>

            <div class="input-group">
              <label>5. รูปปก Icon (เว้นว่างถ้าใช้รูปเดิม):</label>
              <input type="file" id="editThumbnail" accept="image/*" />
            </div>
            <div class="input-group">
              <label>6. รูปภาพมอนสเตอร์ (เว้นว่างถ้าใช้รูปเดิม):</label>
              <input type="file" id="editDetailImage" accept="image/*" />
            </div>
            <div class="input-group">
              <label>7. รายละเอียด (General Info):</label>
              <textarea id="editDescription" rows="4" required></textarea>
            </div>
            <div class="input-group">
              <label>8. ข้อมูลจุดอ่อน (Weakness Text):</label>
              <textarea id="editWeaknessText" rows="3" required></textarea>
            </div>
            <div class="input-group">
              <label>9. รูปภาพบอกจุดอ่อน (เว้นว่างถ้าใช้รูปเดิม):</label>
              <input type="file" id="editWeaknessChart" accept="image/*" />
            </div>
            <button type="submit" class="game-button submit-btn" style="border-color: #1565c0; color: #1565c0">
              บันทึกการแก้ไข
            </button>
          </form>
        </div>
      </div>
    </div>

    <div class="nav-dots"></div>

    <div id="login-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); z-index: 10000; justify-content: center; align-items: center;">
      <div style="background: #2a2a2a; padding: 30px; border-radius: 10px; border: 1px solid #444; width: 300px;">
        <h2 style="color: white; margin-top: 0; text-align: center">Admin Login</h2>
        <form id="admin-login-form" style="display: flex; flex-direction: column; gap: 15px">
          <input type="text" placeholder="Username" required style="padding: 10px; border-radius: 5px; border: none" />
          <input type="password" placeholder="Password" required style="padding: 10px; border-radius: 5px; border: none" />
          <div style="display: flex; gap: 10px">
            <button type="submit" style="flex: 1; padding: 10px; background: #27ae60; color: white; border: none; border-radius: 5px; cursor: pointer;">Login</button>
            <button type="button" onclick="closeLoginModal()" style="flex: 1; padding: 10px; background: #e74c3c; color: white; border: none; border-radius: 5px; cursor: pointer;">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="index.js"></script>
    <div id="imageLightbox" class="lightbox-overlay" onclick="closeLightbox()">
      <span class="lightbox-close">&times;</span>
      <img class="lightbox-content" id="lightboxImg">
    </div>
    <button id="floating-add-btn" class="admin-only floating-add-btn" onclick="openAddModal()">+</button>
  </body>
</html>
