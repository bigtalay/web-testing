<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MH Monster Guide</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="main-container" id="mainContainer">
      <div class="audio-container">
        <div id="youtube-player"></div>
        <button onclick="toggleMute()" id="muteBtn" class="game-button">
          🔊 Mute Music
        </button>
      </div>

      <div class="section sec1 active">
        <button
          id="btn-login"
          class="admin-top-right-btn"
          onclick="openLoginModal()"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
          </svg>
          Admin
        </button>

        <button
          id="btn-logout"
          class="admin-top-right-btn logout-variant"
          onclick="logoutAdmin()"
          style="display: none"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          Logout
        </button>

        <div class="scroll-down" onclick="scrollToSection(1)">
          <div class="arrow"></div>
        </div>
      </div>

      <div class="section sec2">
        <h1 class="monster-list-title">Monster List</h1>
        <div class="monster-grid" id="monsterGrid"></div>
      </div>

      <div class="section sec3">
        <h1 style="color: white; z-index: 2">More to come...</h1>
      </div>
    </div>

    <div class="modal-overlay" id="monsterModal">
      <div class="book-container">
        <div class="close-btn" onclick="closeModal()">&times;</div>
        <div class="book-content-scroll" id="bookContent"></div>
      </div>
    </div>

    <div class="modal-overlay" id="addMonsterModal">
      <div class="book-container add-form-container">
        <div class="close-btn" onclick="closeAddModal()">&times;</div>
        <div class="book-content-scroll">
          <h2 style="text-align: center; color: #5f4b8b">
            + เพิ่มมอนสเตอร์ใหม่
          </h2>
          <form id="addMonsterForm" class="monster-form">
            <div class="input-group">
              <label>1. ชื่อมอนสเตอร์ (Monster Name):</label>
              <input
                type="text"
                id="newName"
                placeholder="เช่น Great Jagras"
                required
              />
            </div>
            <div class="input-group">
              <label>2. รูปปก Icon (URL):</label>
              <input
                type="url"
                id="newThumbnail"
                placeholder="ลิ้งก์รูปภาพสี่เหลี่ยมจัตุรัส"
                required
              />
            </div>
            <div class="input-group">
              <label>3. รูปภาพมอนสเตอร์ในสมุด (URL):</label>
              <input
                type="url"
                id="newDetailImage"
                placeholder="ลิ้งก์รูปมอนสเตอร์ตัวเต็ม"
                required
              />
            </div>
            <div class="input-group">
              <label>4. รายละเอียด (General Info):</label>
              <textarea
                id="newDescription"
                rows="4"
                placeholder="ข้อมูลทั่วไปของมอนสเตอร์..."
                required
              ></textarea>
            </div>
            <div class="input-group">
              <label>5. ข้อมูลจุดอ่อน (Weakness Text):</label>
              <input
                type="text"
                id="newWeaknessText"
                placeholder="เช่น แพ้ไฟ (Fire) ⭐️⭐️⭐️"
                required
              />
            </div>
            <div class="input-group">
              <label>6. รูปภาพบอกจุดอ่อน (URL):</label>
              <input
                type="url"
                id="newWeaknessChart"
                placeholder="ลิ้งก์รูปตารางจุดอ่อน"
              />
            </div>
            <button type="submit" class="game-button submit-btn">
              บันทึกข้อมูลมอนสเตอร์
            </button>
          </form>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="editMonsterModal">
      <div class="book-container add-form-container">
        <div class="close-btn" onclick="closeEditModal()">&times;</div>
        <div class="book-content-scroll">
          <h2 style="text-align: center; color: #1565c0">
            📝 แก้ไขข้อมูลมอนสเตอร์
          </h2>
          <form id="editMonsterForm" class="monster-form">
            <input type="hidden" id="editMonsterId" />
            <div class="input-group">
              <label>1. ชื่อมอนสเตอร์ (Monster Name):</label>
              <input type="text" id="editName" required />
            </div>
            <div class="input-group">
              <label>2. รูปปก Icon (URL):</label>
              <input type="url" id="editThumbnail" required />
            </div>
            <div class="input-group">
              <label>3. รูปภาพมอนสเตอร์ในสมุด (URL):</label>
              <input type="url" id="editDetailImage" required />
            </div>
            <div class="input-group">
              <label>4. รายละเอียด (General Info):</label>
              <textarea id="editDescription" rows="4" required></textarea>
            </div>
            <div class="input-group">
              <label>5. ข้อมูลจุดอ่อน (Weakness Text):</label>
              <input type="text" id="editWeaknessText" required />
            </div>
            <div class="input-group">
              <label>6. รูปภาพบอกจุดอ่อน (URL):</label>
              <input type="url" id="editWeaknessChart" />
            </div>
            <button
              type="submit"
              class="game-button submit-btn"
              style="border-color: #1565c0; color: #1565c0"
            >
              บันทึกการแก้ไข
            </button>
          </form>
        </div>
      </div>
    </div>

    <div class="nav-dots">
      <div class="dot active" onclick="scrollToSection(0)"></div>
      <div class="dot" onclick="scrollToSection(1)"></div>
      <div class="dot" onclick="scrollToSection(2)"></div>
    </div>

    <div
      id="login-modal"
      style="
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        z-index: 10000;
        justify-content: center;
        align-items: center;
      "
    >
      <div
        style="
          background: #2a2a2a;
          padding: 30px;
          border-radius: 10px;
          border: 1px solid #444;
          width: 300px;
        "
      >
        <h2 style="color: white; margin-top: 0; text-align: center">
          Admin Login
        </h2>

        <form
          id="admin-login-form"
          style="display: flex; flex-direction: column; gap: 15px"
        >
          <input
            type="text"
            placeholder="Username"
            required
            style="padding: 10px; border-radius: 5px; border: none"
          />
          <input
            type="password"
            placeholder="Password"
            required
            style="padding: 10px; border-radius: 5px; border: none"
          />

          <div style="display: flex; gap: 10px">
            <button
              type="submit"
              style="
                flex: 1;
                padding: 10px;
                background: #27ae60;
                color: white;
                border: none;
                border-radius: 5px;
                cursor: pointer;
              "
            >
              Login
            </button>
            <button
              type="button"
              onclick="closeLoginModal()"
              style="
                flex: 1;
                padding: 10px;
                background: #e74c3c;
                color: white;
                border: none;
                border-radius: 5px;
                cursor: pointer;
              "
            >
              Cancel
            </button>
          </div>
        </form>
      </div>
    </div>
    <script type="module" src="index.js"></script>
  </body>
</html>
